<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F0C29"/>
      <stop offset="55%" stop-color="#2A1B5E"/>
      <stop offset="100%" stop-color="#0E3B33"/>
    </linearGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFE"/>
      <stop offset="50%" stop-color="#B9A6FF"/>
      <stop offset="100%" stop-color="#7DF0C0"/>
      <animate attributeName="x1" values="0;-1;0" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="1;2;1" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="glow1"><stop offset="0%" stop-color="#7F5AF0" stop-opacity=".55"/><stop offset="100%" stop-color="#7F5AF0" stop-opacity="0"/></radialGradient>
    <radialGradient id="glow2"><stop offset="0%" stop-color="#2CB67D" stop-opacity=".45"/><stop offset="100%" stop-color="#2CB67D" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#FFFFFF" stroke-opacity=".05"/>
    </pattern>
    <clipPath id="r"><rect width="1200" height="300" rx="20"/></clipPath>
  </defs>
  <style>
    .t{font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif}
        .float{animation:fl 6s ease-in-out infinite}
    .float2{animation:fl 7s ease-in-out infinite reverse}
    @keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
    .blink{animation:bl 1.1s steps(1) infinite}
    @keyframes bl{50%{opacity:0}}
  </style>
  <g clip-path="url(#r)">
    <rect width="1200" height="300" fill="url(#bg)"/>
    <rect width="1200" height="300" fill="url(#grid)"/>
    <circle class="float" cx="180" cy="70" r="190" fill="url(#glow1)"/>
    <circle class="float2" cx="1040" cy="250" r="210" fill="url(#glow2)"/>

    <!-- phone outline -->
    <g transform="translate(1000 60)"><g class="float" opacity=".9">
      <rect x="0" y="0" width="96" height="176" rx="18" fill="#16161A" stroke="#7F5AF0" stroke-width="2"/>
      <rect x="36" y="9" width="24" height="5" rx="2.5" fill="#2CB67D"/>
      <rect x="12" y="28" width="72" height="34" rx="8" fill="#7F5AF0" opacity=".85"/>
      <rect x="12" y="70" width="34" height="34" rx="8" fill="#2CB67D" opacity=".8"/>
      <rect x="50" y="70" width="34" height="34" rx="8" fill="#FFFFFE" opacity=".18"/>
      <rect x="12" y="112" width="72" height="8" rx="4" fill="#FFFFFE" opacity=".25"/>
      <rect x="12" y="126" width="50" height="8" rx="4" fill="#FFFFFE" opacity=".15"/>
      <rect x="30" y="156" width="36" height="4" rx="2" fill="#FFFFFE" opacity=".35"/>
    </g></g>
    <!-- code brackets -->
    <text class="t float2" x="70" y="250" font-size="60" font-weight="700" fill="#7F5AF0" opacity=".35">&lt;/&gt;</text>

    <text class="t" x="600" y="135" text-anchor="middle" font-size="68" font-weight="800" fill="url(#txt)" letter-spacing="1">Zeynep Güneş</text>
    <text class="t" x="600" y="185" text-anchor="middle" font-size="24" font-weight="600" fill="#2CB67D" letter-spacing="3">SOFTWARE ENGINEER · MOBILE &amp; FRONT-END</text>
    <g>
      <text class="t" x="600" y="228" text-anchor="middle" font-size="18" fill="#C9C3E6">React Native · Flutter · React · Next.js · iOS · Android<tspan class="blink" fill="#2CB67D"> ▌</tspan></text>
    </g>
  </g>
</svg>
