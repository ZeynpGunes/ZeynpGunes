<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="140" viewBox="0 0 1200 140">
  <defs>
    <linearGradient id="w" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2CB67D"/>
      <stop offset="50%" stop-color="#7F5AF0"/>
      <stop offset="100%" stop-color="#0F0C29"/>
    </linearGradient>
  </defs>
  <style>
    .t{font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif}
    .wave{animation:mv 9s linear infinite}
    .wave2{animation:mv 13s linear infinite reverse;opacity:.5}
    @keyframes mv{from{transform:translateX(0)}to{transform:translateX(-600px)}}
  </style>
  <g class="wave2">
    <path d="M0 60 Q150 20 300 60 T600 60 T900 60 T1200 60 T1500 60 T1800 60 V140 H0Z" fill="url(#w)"/>
  </g>
  <g class="wave">
    <path d="M0 75 Q150 40 300 75 T600 75 T900 75 T1200 75 T1500 75 T1800 75 V140 H0Z" fill="url(#w)"/>
  </g>
  <text class="t" x="600" y="118" text-anchor="middle" font-size="24" font-weight="700" fill="#FFFFFE">Thanks for visiting! ✨</text>
</svg>
